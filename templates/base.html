<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Store</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #222;
        line-height: 1.6;
    }

    /* Navigation */
    nav {
        background: #111827;
        color: white;
        padding: 18px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    nav h2 {
        font-size: 24px;
    }

    nav div {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 15px;
        transition: 0.3s;
    }

    nav a:hover {
        color: #60a5fa;
    }

    /* Main container */
    .container {
        width: 86%;
        max-width: 1200px;
        margin: 45px auto;
    }

    .container > h1 {
        font-size: 34px;
        margin-bottom: 10px;
    }

    /* Product grid */
    .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 25px;
        margin-top: 30px;
    }

    /* Product card */
    .product-card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        transition: transform 0.25s, box-shadow 0.25s;
    }

    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
    }

    .product-card h2,
    .product-card h3 {
        margin-bottom: 12px;
        color: #111827;
    }

    .price {
        color: #2563eb;
        font-size: 22px;
        font-weight: bold;
        margin: 15px 0;
    }

    /* Buttons */
    .btn {
        display: inline-block;
        background: #2563eb;
        color: white;
        padding: 11px 18px;
        border-radius: 7px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        font-size: 14px;
        margin: 5px 3px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
    }

    /* Forms */
    form {
        background: white;
        padding: 30px;
        margin-top: 25px;
        max-width: 550px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    input,
    textarea {
        width: 100%;
        padding: 13px;
        margin: 8px 0 15px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 15px;
        font-family: inherit;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: #2563eb;
    }

    /* Footer */
    footer {
        background: #111827;
        color: white;
        text-align: center;
        padding: 22px;
        margin-top: 60px;
    }

    /* Mobile */
    @media (max-width: 650px) {
        nav {
            flex-direction: column;
            text-align: center;
        }

        nav div {
            flex-wrap: wrap;
            justify-content: center;
        }

        .container {
            width: 92%;
            margin: 30px auto;
        }

        .container > h1 {
            font-size: 27px;
        }
    }
</style>
</head>

<body>

<nav>
    <h2>CodeAlpha Store 🛍️</h2>

    <div>
        <a href="/">Home</a>
        <a href="/cart/">Cart</a>

        {% if user.is_authenticated %}
            <a href="/orders/">Orders</a>
            <a href="/logout/">Logout</a>
        {% else %}
            <a href="/login/">Login</a>
            <a href="/register/">Register</a>
        {% endif %}
    </div>
</nav>
{% if messages %}
    <div class="container">
        {% for message in messages %}
            <div class="product-card">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}

{% block content %}
{% endblock %}
<footer>
    <p>© 2026 CodeAlpha Store | Built with Django</p>
</footer>

</body>
</html>
