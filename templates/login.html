{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h1>Login</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >
        </p>

        <p>
            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >
        </p>

        <button class="btn" type="submit">
            Login
        </button>

    </form>

</div>

{% endblock %}
