{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h1>📦 My Orders</h1>

    {% for order in orders %}

        <div class="product-card" style="margin-top:20px;">

            <h2>Order #{{ order.id }}</h2>

            <p>Total: ₹{{ order.total_amount }}</p>

            <p>
                Ordered on: {{ order.ordered_at }}
            </p>

            <p>
                Delivery Address: {{ order.address }}
            </p>

        </div>

    {% empty %}

        <p>You have not placed any orders yet.</p>

    {% endfor %}

</div>

{% endblock %}
